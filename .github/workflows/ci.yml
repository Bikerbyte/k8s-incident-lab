name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pip install --quiet yamllint
          curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Shell syntax (bash -n)
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Shell lint (shellcheck)
        run: |
          shellcheck --severity=warning scripts/*.sh

      - name: Python syntax
        run: |
          python3 -m py_compile console/server.py
          echo "ok  console/server.py"

      - name: JavaScript syntax
        run: |
          node --check console/static/app.js
          echo "ok  console/static/app.js"

      - name: YAML lint
        run: |
          yamllint -c .yamllint.yml \
            app/manifests/ \
            monitoring/dashboards/ \
            monitoring/alerts/ \
            monitoring/servicemonitors/ \
            monitoring/helm-values/

      - name: Kubernetes manifests (dry-run client)
        run: |
          # --validate=false is required in CI because kubectl tries to download
          # the OpenAPI schema from the API server even in --dry-run=client mode.
          # Without a running cluster, that request fails.
          for f in \
            app/manifests/namespace.yaml \
            app/manifests/podinfo.yaml \
            monitoring/dashboards/podinfo-overview-dashboard.yaml \
            monitoring/alerts/podinfo-alerts.yaml \
            monitoring/servicemonitors/podinfo-servicemonitor.yaml; do
            kubectl apply --dry-run=client --validate=false -f "$f"
            echo "ok  $f"
          done
