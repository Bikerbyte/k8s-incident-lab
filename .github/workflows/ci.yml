name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          pip install --quiet yamllint
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Shell syntax (bash -n)
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Shell lint (shellcheck)
        run: |
          shellcheck --severity=warning scripts/*.sh

      - name: Python syntax
        run: |
          python3 -m py_compile console/server.py
          echo "ok  console/server.py"

      - name: JavaScript syntax
        run: |
          node --check console/static/app.js
          echo "ok  console/static/app.js"

      - name: YAML lint
        run: |
          yamllint -c .yamllint.yml \
            app/manifests/ \
            monitoring/dashboards/ \
            monitoring/alerts/ \
            monitoring/servicemonitors/ \
            monitoring/helm-values/

      - name: Kubernetes manifests (kubeconform)
        run: |
          # kubeconform validates manifests against offline Kubernetes schemas.
          # -ignore-missing-schemas skips CRDs (PrometheusRule, ServiceMonitor)
          # that have no entry in the public schema registry.
          kubeconform -strict -ignore-missing-schemas \
            app/manifests/ \
            monitoring/dashboards/ \
            monitoring/alerts/ \
            monitoring/servicemonitors/
